name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'requirements.txt'
      - 'Dockerfile'

env:
  PROJECT_ID: wakilz-dasboard
  SERVICE_NAME: wakilz-voice
  REGION: asia-south1
  IMAGE: gcr.io/wakilz-dasboard/wakilz-voice

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for gcr.io
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --update-env-vars "FIREBASE_PROJECT_ID=wakilz-dasboard,RASEN_AGENT_ID=29053a66-602c-463e-aac4-ac8d238f1e52,RASEN_API_BASE=https://kalpa-api-454269687527.asia-south1.run.app/api/rasen/workspace,ALLOWED_ORIGIN=https://wakilz-dasboard.web.app,PORT=8080" \
            --quiet
