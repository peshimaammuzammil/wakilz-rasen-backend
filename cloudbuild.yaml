steps:
  # Build the Docker image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wakilz-voice:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wakilz-voice:latest'
      - '.'

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wakilz-voice:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wakilz-voice:latest']

  # Deploy to Cloud Run — env vars are set here permanently
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wakilz-voice'
      - '--image=gcr.io/$PROJECT_ID/wakilz-voice:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - >-
        RASEN_API_BASE=https://kalpa-api-454269687527.asia-south1.run.app/api/rasen/workspace,
        RASEN_AGENT_ID=29053a66-602c-463e-aac4-ac8d238f1e52,
        FIREBASE_PROJECT_ID=wakilz-dasboard,
        ALLOWED_ORIGIN=https://wakilz-dasboard.web.app,
        PORT=8080

      # NOTE: RASEN_API_KEY, JWT_SECRET, HUBSPOT_ACCESS_TOKEN are set as
      # Cloud Run secrets — NOT here. Use Secret Manager for those.

images:
  - 'gcr.io/$PROJECT_ID/wakilz-voice:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/wakilz-voice:latest'

options:
  logging: CLOUD_LOGGING_ONLY
